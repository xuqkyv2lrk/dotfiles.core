# Video
vo=gpu-next
gpu-api=vulkan
hwdec=auto-copy
# Tag HDR video with its own colorspace even when the compositor prefers SDR, so
# compositors with automatic HDR (Umbriel hdr = "auto") switch the display for it
target-colorspace-hint=yes
target-colorspace-hint-mode=source

# Keep PipeWire stream open while paused to avoid audio cut on resume
audio-stream-silence=yes

# Resume playback from where you left off
save-position-on-quit=yes

# Auto-load subtitles with similar filenames
sub-auto=fuzzy

# Screenshots
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
